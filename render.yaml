services:
  - type: web
    name: meshai
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "npm run install:all && npm run build --prefix client && npm run build --prefix server"
    startCommand: "cd server && SERVE_CLIENT=true NODE_ENV=production npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: PORT
        value: "3000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEBIUS_API_KEY
        sync: false
